# Odoo Community + PostgreSQL + nginx reverse proxy — single instance, multi-database.
# Each company = one Odoo database (isolated data, own users, unlimited users each).
# Reached at https://<company>.odoo.local via the reverse proxy, or http://localhost:8069
# directly (database manager / admin). Versions/ports/passwords come from .env.

services:
  reverse_proxy:
    image: nginx:stable-alpine
    container_name: odoo-reverse-proxy
    depends_on:
      - web
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      # rendered into the HTTP->HTTPS redirect so it follows a non-443 HTTPS_PORT
      HTTPS_PORT: '${HTTPS_PORT:-443}'
    volumes:
      - ./.docker/dev/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./.docker/dev/nginx/certs:/etc/nginx/certs:ro
    networks:
      - odoo
    restart: unless-stopped

  db:
    image: postgres:${PG_TAG:-16}
    container_name: odoo-db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      POSTGRES_DB: postgres
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'odoo']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - odoo
    restart: unless-stopped

  web:
    # Stock Odoo + free OCR stack (Tesseract) — see docker/odoo/Dockerfile.
    build:
      context: .
      dockerfile: docker/odoo/Dockerfile
      args:
        ODOO_TAG: ${ODOO_TAG:-19.0}
    image: community-plus-odoo:${ODOO_TAG:-19.0}
    container_name: odoo-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${ODOO_PORT:-8069}:8069'        # direct access: database manager / admin
      - '${ODOO_CHAT_PORT:-8072}:8072'   # longpolling / websocket (dev convenience)
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-web-data:/var/lib/odoo      # filestore (attachments, per-DB)
      - ./config:/etc/odoo               # odoo.conf (rendered by start.sh)
      - ./addons:/mnt/extra-addons       # your custom modules
    networks:
      - odoo
    restart: unless-stopped

networks:
  odoo:
    driver: bridge

volumes:
  odoo-db-data:
    driver: local
  odoo-web-data:
    driver: local
