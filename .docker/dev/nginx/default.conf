# Odoo 19 reverse proxy (dev). Mirrors the project's house style
# (.docker/<env>/nginx/default.conf + mkcert certs + *.odoo.local alias).
# Two upstreams: the web worker (8069) and the gevent/websocket worker (8072).

upstream odoo {
    server web:8069;
}
upstream odoochat {
    server web:8072;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS
server {
    listen      80;
    listen [::]:80;
    server_name odoo.local *.odoo.local localhost;
    return 301 https://$host:${HTTPS_PORT}$request_uri;
}

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name odoo.local *.odoo.local localhost;

    ssl_certificate     /etc/nginx/certs/odoo.local.pem;
    ssl_certificate_key /etc/nginx/certs/odoo.local-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 200M;          # large imports / attachments
    proxy_read_timeout    720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout    720s;

    # Forwarded headers — Odoo trusts these because proxy_mode = True.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Websocket bus (live chat, discuss, real-time UI). Odoo 19 uses /websocket.
    location /websocket {
        proxy_pass         http://odoochat;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }

    # Legacy longpolling fallback.
    location /longpolling {
        proxy_pass http://odoochat;
    }

    # Cache Odoo's static assets.
    location ~* /web/static/ {
        proxy_cache_valid 200 90m;
        proxy_buffering   on;
        proxy_pass        http://odoo;
    }

    location / {
        proxy_pass     http://odoo;
        proxy_redirect off;
    }

    gzip            on;
    gzip_types      text/css text/plain application/javascript application/json image/svg+xml;

    error_page 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
