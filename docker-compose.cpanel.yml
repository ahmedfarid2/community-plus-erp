name: onesuite-nextgen

services:
  db:
    image: postgres:${PG_TAG:-16}
    container_name: onesuite-nextgen-db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - onesuite-db-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [onesuite]

  web:
    build:
      context: .
      dockerfile: docker/odoo/Dockerfile
      args:
        ODOO_TAG: ${ODOO_TAG:-19.0}
    image: onesuite-nextgen-odoo:${ODOO_TAG:-19.0}
    container_name: onesuite-nextgen-web
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${ONESUITE_HTTP_PORT:-18069}:8069"
      - "127.0.0.1:${ONESUITE_CHAT_PORT:-18072}:8072"
    volumes:
      - onesuite-web-data:/var/lib/odoo:Z
      - ./config:/etc/odoo:Z
      - ./addons:/mnt/extra-addons:Z
    restart: unless-stopped
    networks: [onesuite]

networks:
  onesuite:
    driver: bridge

volumes:
  onesuite-db-data:
    name: onesuite_nextgen_db_data
  onesuite-web-data:
    name: onesuite_nextgen_web_data
